[package]
name = "ciphera-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ciphera CLI — official client for the Ciphera secret management system"
repository = "https://github.com/lucaswilliameufrasio/ciphera-cli"
license = "MIT"
authors = ["Lucas Eufrasio"]
default-run = "ciphera"

[[bin]]
name = "ciphera"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ciphera-core = { path = "../ciphera-core" }
keyring = "4.1.5"
dialoguer = "0.12.0"

[dev-dependencies]
tempfile = "3.27"
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
